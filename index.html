<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ALMACENERA — Control de Silos</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f8;--surface:#fff;--surface2:#edf1f5;
  --border:#d8e2ec;--border2:#b8cad8;
  --navy:#0c2840;--navy2:#1a3f5c;
  --gold:#c07818;--gold2:#e09820;
  --steel:#2a6888;--green:#167848;--red:#982828;
  --t1:#0a1e30;--t2:#3a5870;--t3:#7a98b0;
  --r:10px;--sh:0 2px 10px rgba(12,40,64,.08);--sh2:0 6px 24px rgba(12,40,64,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;}

header{background:var(--navy);height:58px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.28);}
.hbrand{display:flex;align-items:center;gap:11px;}
.hicon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:17px;}
.htitle{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;color:#fff;line-height:1;}
.hsub{font-size:9px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;margin-top:2px;}
.hkpis{display:flex;}
.hkpi{padding:0 16px;border-left:1px solid rgba(255,255,255,.1);text-align:center;}
.hkpi-v{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--gold2);line-height:1;}
.hkpi-l{font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:2px;}
.hright{display:flex;align-items:center;gap:10px;}
.spill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:4px 11px;}
.sdot{width:7px;height:7px;border-radius:50%;background:#2ecc71;box-shadow:0 0 6px #2ecc71;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.stxt{font-size:9px;color:rgba(255,255,255,.5);letter-spacing:.5px;}
#clk{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.35);text-align:right;line-height:1.4;}

/* FILTRO FECHA */
.date-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.date-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--t2);}
.date-pills{display:flex;gap:6px;flex-wrap:wrap;}
.dp{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface2);color:var(--t2);cursor:pointer;transition:all .2s;white-space:nowrap;}
.dp:hover{border-color:var(--navy);color:var(--navy);}
.dp.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.date-info{font-size:10px;color:var(--t3);margin-left:auto;font-style:italic;}

.kpi-bar{display:flex;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
.kpi-card{flex:1;min-width:130px;border:1px solid var(--border);border-top:3px solid;border-radius:var(--r);padding:13px 16px;background:var(--surface);box-shadow:var(--sh);transition:box-shadow .2s,transform .2s;}
.kpi-card:hover{box-shadow:var(--sh2);transform:translateY(-1px);}
.kpi-card.nv{border-top-color:var(--navy);}
.kpi-card.gd{border-top-color:var(--gold);}
.kpi-card.gn{border-top-color:var(--green);}
.kpi-card.st{border-top-color:var(--steel);}
.klbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--t3);margin-bottom:5px;}
.kval{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;line-height:1;color:var(--t1);}
.kpi-card.gd .kval{color:var(--gold);}
.kpi-card.gn .kval{color:var(--green);}
.kpi-card.st .kval{color:var(--steel);}
.ksub{font-size:10px;color:var(--t3);margin-top:3px;}
.kmbar{height:3px;background:var(--border);border-radius:2px;margin-top:7px;overflow:hidden;}
.kmfill{height:3px;border-radius:2px;transition:width 1s ease;}

.tabs-nav{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 24px;overflow-x:auto;}
.tbtn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:13px 18px;color:var(--t3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:7px;}
.tbtn:hover{color:var(--t2);}
.tbtn.active{color:var(--navy);border-bottom-color:var(--navy);}
.tcnt{background:var(--surface2);border:1px solid var(--border);border-radius:12px;font-size:9px;padding:1px 7px;color:var(--t3);}
.tbtn.active .tcnt{background:var(--navy);border-color:var(--navy);color:#fff;}

.panel{display:none;padding:18px 24px;}
.panel.active{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

.lsum{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
.lstat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 15px;flex:1;min-width:110px;box-shadow:var(--sh);}
.lsl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);}
.lsv{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--t1);margin-top:2px;}

/* LEYENDA */
.legend{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:10px;color:var(--t2);flex-wrap:wrap;}
.legend strong{color:var(--t1);font-weight:600;font-size:11px;}
.li{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:3px 8px;}
.ld{width:7px;height:7px;border-radius:50%;}

.sgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}

.sc{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:8px 6px 10px;cursor:pointer;box-shadow:var(--sh);transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;}
.sc:hover{transform:translateY(-3px);box-shadow:var(--sh2);}
.sc.s1{border-color:#167848;}.sc.s0{border-color:#2a6888;}.sc.sm1{border-color:#982828;}
.sc.s2{border-color:#c07818;}.sc.sm2{border-color:#8b44ac;}
.sc svg{display:block;}
.snom{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--navy);margin-top:5px;text-transform:uppercase;white-space:nowrap;}
.stipo{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--t3);}
.sfecha{font-size:7px;color:var(--t3);margin-top:1px;}
.smat{font-size:8px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;max-width:100%;margin-top:1px;font-weight:500;}
.sstock{border-radius:6px;padding:2px 8px;margin-top:4px;font-size:9px;font-weight:600;font-family:'Barlow Condensed',sans-serif;}
.scap{font-size:7px;color:var(--t3);margin-top:1px;}
.spbar{width:82%;height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.spfill{height:3px;border-radius:2px;transition:width 1s;}
.sest{font-size:8px;font-weight:600;margin-top:3px;}
.ebadge{position:absolute;top:7px;right:7px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:7px;color:var(--t3);letter-spacing:1px;}

#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:14px;}
.spinner{width:40px;height:40px;border:3px solid var(--border2);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ltxt{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--t3);text-transform:uppercase;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* FIREBASE BADGE */
.fb-badge{display:flex;align-items:center;gap:5px;background:rgba(66,133,244,.15);border:1px solid rgba(66,133,244,.3);border-radius:20px;padding:3px 11px;}
.fb-dot{width:6px;height:6px;border-radius:50%;background:#4a90e2;}
.fb-dot.ok{background:#4a90e2;box-shadow:0 0 6px #4a90e2;animation:blink 2s ease-in-out infinite;}
.fb-dot.err{background:#e74c3c;box-shadow:0 0 5px #e74c3c;}
.fb-dot.loading{background:#e09820;animation:blink .5s ease-in-out infinite;}
.fb-txt{font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.5px;}
</style>

<body>

<header>
  <div class="hbrand"><div class="hicon">🌾</div><div><div class="htitle">ALMACENERA S.A.</div><div class="hsub">Control de Inventario · Silos & Bodegas</div></div></div>
  <div class="hkpis" id="hkpis"></div>
  <div class="hright">
    <div class="spill"><div class="sdot" id="sdot"></div><span class="stxt" id="stxt">Cargando…</span></div>
    <div class="fb-badge"><div class="fb-dot loading" id="fbDot"></div><span class="fb-txt" id="fbTxt">Firebase…</span></div>
    <div id="clk"></div>
  </div>
</header>

<!-- FILTRO DE FECHA -->
<div class="date-bar" id="dateBar" style="display:none">
  <span class="date-label">📅 Inventario:</span>
  <div class="date-pills" id="datePills"></div>
  <span class="date-info" id="dateInfo"></span>
</div>

<div class="kpi-bar" id="kbar"></div>
<nav class="tabs-nav" id="tnav"></nav>
<main id="main"><div id="loading"><div class="spinner"></div><div class="ltxt">Cargando datos…</div></div></main>

<script>
/* ══ URLs ══════════════════════════════════════════════ */
var URL_INV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQsHD68GsN5kH9NtuQF5g_Q_lTQmJEv6YDnLfnd6zurixDZrkw-7loPPxlBEC3khaX3vnlM4eFNuXBy/pub?gid=0&single=true&output=csv';
var URL_EST='https://docs.google.com/spreadsheets/d/e/2PACX-1vQsHD68GsN5kH9NtuQF5g_Q_lTQmJEv6YDnLfnd6zurixDZrkw-7loPPxlBEC3khaX3vnlM4eFNuXBy/pub?gid=349286573&single=true&output=csv';

/* ══ ESTADOS DEL GRANO (5 opciones — clic cíclico) ══════
   1  = ▲  Llenando     (cono arriba)
   0  = ➖  Estable      (plano)
  -1  = ▼  Vaciando     (cono abajo)
   2  = ╱  Inclinado45  (rampa 45°)
  -2  = ∧∧ Doble montaña
═══════════════════════════════════════════════════════ */
var SC={
  '1' :{i:'▲', l:'LLENANDO',   c:'#167848', cl:'s1'},
  '0' :{i:'➖', l:'ESTABLE',    c:'#2a6888', cl:'s0'},
  '-1':{i:'▼', l:'VACIANDO',   c:'#982828', cl:'sm1'},
  '2' :{i:'╱', l:'INCLINADO',  c:'#c07818', cl:'s2'},
  '-2':{i:'∧∧',l:'DOBLE PICO', c:'#8b44ac', cl:'sm2'}
};
var STATE_ORDER=[1,0,-1,2,-2];  /* ciclo al hacer clic */

var GS={}, INV={}, EST=[], TAB=0;
/* ALL_INV[fechaISO][cod] = {kg,m} — para filtro de fecha */
var ALL_INV={}, ALL_DATES=[], SEL_DATE=null;


/* ══ FIREBASE — agripac-control ══════════════════════════════════════════
   Colección: silos_estados  |  Documento: almacenera
   Guarda/escucha el estado del grano de cada silo en tiempo real
══════════════════════════════════════════════════════════════════════════ */
firebase.initializeApp({
  apiKey:            'AIzaSyANUkQlUGrMh4ET1LdyYCucuZqqVKR39u4',
  authDomain:        'agripac-control.firebaseapp.com',
  databaseURL:       'https://agripac-control-default-rtdb.firebaseio.com',
  projectId:         'agripac-control',
  storageBucket:     'agripac-control.firebasestorage.app',
  messagingSenderId: '1033116506620',
  appId:             '1:1033116506620:web:d4472bec9f6178b48bba79',
  measurementId:     'G-J4MGT2J80C'
});
var fbDB = firebase.firestore();
var FB_COL = 'silos_estados';
var FB_DOC = 'almacenera';

function setFbUI(state){
  var dot=document.getElementById('fbDot');
  var txt=document.getElementById('fbTxt');
  if(state==='ok')  { dot.className='fb-dot ok';  txt.textContent='🔥 Sincronizado'; }
  else if(state==='err'){ dot.className='fb-dot err'; txt.textContent='Firebase error'; }
  else              { dot.className='fb-dot loading'; txt.textContent='Firebase…'; }
}

/* Guarda el estado de UN silo en Firestore */
function saveEstado(nom, estado){
  var upd={};  upd[nom]=estado;
  fbDB.collection(FB_COL).doc(FB_DOC)
    .set(upd,{merge:true})
    .catch(function(e){console.error('[FB save]',e);});
}

/* Escucha cambios en tiempo real — actualiza GS y re-renderiza */
function initFirebase(){
  fbDB.collection(FB_COL).doc(FB_DOC)
    .onSnapshot(function(snap){
      if(snap.exists){
        var data=snap.data();
        Object.keys(data).forEach(function(k){ GS[k]=data[k]; });
      }
      setFbUI('ok');
      if(EST.length) render();   /* re-render cuando llegan cambios */
    }, function(err){
      console.error('[FB listen]',err);
      setFbUI('err');
    });
}

/* ══ UTILS ═══════════════════════════════════════════ */
function normCode(r){return parseInt(String(r||'').trim().replace(/^0+/,''))||0;}
function pn(s){
  if(typeof s==='number')return s;
  s=String(s||'').trim().replace(/\s/g,'');if(!s||s==='-')return 0;
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1)
    s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.indexOf(',')>-1)s=s.replace(',','.');
  return parseFloat(s)||0;
}
function ft(kg){var t=kg/1000;if(t>=1000)return(t/1000).toFixed(1)+'k TON';if(t>=100)return Math.round(t)+' TON';return t.toFixed(2)+' TON';}
function fn(n){return n.toLocaleString('es-EC',{maximumFractionDigits:0});}
function pc(p){return p>=85?'#982828':p>=50?'#b06010':'#167848';}
function pb(p){return p>=85?'rgba(152,40,40,.1)':p>=50?'rgba(176,96,16,.1)':'rgba(22,120,72,.1)';}
function pt(p){return p>=85?'#c03030':p>=50?'#c87018':'#189858';}
function mapTipo(r){r=String(r||'').toUpperCase();if(r.indexOf('CONICO')>-1||r.indexOf('PULMON')>-1||r.indexOf('PULMÓN')>-1)return 'PULMON';if(r.indexOf('BODEGA')>-1)return 'BODEGA';if(r.indexOf('TOLVA')>-1)return 'TOLVA';return 'SILO';}
function normDate(s){
  s=String(s||'').trim();if(!s)return null;
  var m;
  if((m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/)))return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if((m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/)))return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  var d=new Date(s);return isNaN(d)?null:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){if(!iso)return'—';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}

/* ══ CSV ═════════════════════════════════════════════ */
function parseCSV(txt){
  var rows=[],cur=[],cell='',inQ=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(c==='"'){if(inQ&&txt[i+1]==='"'){cell+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){cur.push(cell.trim());cell='';}
    else if((c==='\n'||c==='\r')&&!inQ){
      if(cell||cur.length){cur.push(cell.trim());rows.push(cur);}
      cell='';cur=[];if(c==='\r'&&txt[i+1]==='\n')i++;
    }else cell+=c;
  }
  if(cell||cur.length){cur.push(cell.trim());rows.push(cur);}
  if(!rows.length)return{hdr:[],rows:[]};
  var hdr=rows[0].map(function(h){return h.replace(/"/g,'').trim();});
  return{hdr:hdr,rows:rows.slice(1).filter(function(r){return r.some(function(c){return c;});}).map(function(r){var o={};hdr.forEach(function(h,j){o[h]=(r[j]||'').replace(/"/g,'').trim();});o._r=r;return o;})};
}

/* ══ ESTRUCTURA ══════════════════════════════════════ */
function buildEST(p){
  var est=[];
  p.rows.forEach(function(r){
    var row=r._r||[];
    var cod=normCode(row[0]||(r['Almacén']||r['Almacen']||''));
    var ubi=String(row[1]||r['UBICACION']||'').trim().toUpperCase();
    var nom=String(row[2]||r['NOMBRE ALMACEN']||'').trim().toUpperCase();
    var cap=pn(row[3]||r['CAP ALM TON']||'0');
    var tipo=mapTipo(row[4]||r['TIPO SILO']||'SILO');
    if(!cod||!nom||nom==='-'||cap<=0)return;
    est.push({cod:cod,u:ubi,n:nom,c:cap,t:tipo});
  });
  est.sort(function(a,b){return a.u!==b.u?a.u.localeCompare(b.u):b.c-a.c;});
  return est;
}

/* ══ INVENTARIO por Fecha ════════════════════════════
   Col A (0) = FECHA
   Col C (2) = Texto breve de material (nombre producto)
   Col E (4) = Almacén (código "0012"→12)
   Col G (6) = Libre utilización (KG)
══════════════════════════════════════════════════════ */
function buildALL(p){
  var allInv={}, dateSet={};
  p.rows.forEach(function(r){
    var row=r._r||[];
    var fechaISO=normDate(row[0]||'');
    var cod=normCode(row[4]||r['Almacén']||r['Almacen']||'');
    var mat=String(row[2]||r['Texto breve de material']||'').trim();
    var kg=pn(row[6]||r['Libre utilización']||'0');
    if(!cod||!fechaISO)return;
    if(!allInv[fechaISO])allInv[fechaISO]={};
    if(!allInv[fechaISO][cod])allInv[fechaISO][cod]={kg:0,m:'',_mx:0};
    allInv[fechaISO][cod].kg+=kg;
    if(mat&&Math.abs(kg)>allInv[fechaISO][cod]._mx){allInv[fechaISO][cod].m=mat;allInv[fechaISO][cod]._mx=Math.abs(kg);}
    dateSet[fechaISO]=true;
  });
  var dates=Object.keys(dateSet).sort().reverse();
  return{allInv:allInv,dates:dates};
}

function applyDate(iso){
  SEL_DATE=iso;
  var day=ALL_INV[iso]||{};
  var inv={};
  EST.forEach(function(d){
    var raw=day[d.cod]||{kg:0,m:''};
    inv[d.cod]={kg:Math.max(0,raw.kg),m:raw.m};
  });
  INV=inv;
}

function buildDatePills(){
  document.getElementById('dateBar').style.display='flex';
  var c=document.getElementById('datePills');
  c.innerHTML='';
  ALL_DATES.forEach(function(iso){
    var btn=document.createElement('button');
    btn.className='dp'+(iso===SEL_DATE?' active':'');
    btn.textContent=fmtDate(iso);
    btn.dataset.date=iso;
    btn.addEventListener('click',function(){
      applyDate(this.dataset.date);
      buildDatePills();render();
    });
    c.appendChild(btn);
  });
  var n=Object.keys(ALL_INV[SEL_DATE]||{}).filter(function(k){return ALL_INV[SEL_DATE][k].kg>0;}).length;
  document.getElementById('dateInfo').textContent=n+' almacenes con stock · '+fmtDate(SEL_DATE);
}

/* ══ SYNC ════════════════════════════════════════════ */
function setSync(ok,txt){
  var dot=document.getElementById('sdot');
  dot.style.cssText='background:'+(ok?'#2ecc71':'#e74c3c')+';box-shadow:0 0 6px '+(ok?'#2ecc71':'#e74c3c');
  document.getElementById('stxt').textContent=txt;
}

/* ══ LOAD ════════════════════════════════════════════ */
function load(){
  Promise.all([
    fetch(URL_INV+'&_t='+Date.now()).then(function(r){return r.text();}),
    fetch(URL_EST+'&_t='+Date.now()).then(function(r){return r.text();})
  ]).then(function(res){
    var invP=parseCSV(res[0]);
    var estP=parseCSV(res[1]);
    var estOk=estP.rows.length>0&&estP.hdr.some(function(h){return h.toUpperCase().indexOf('CAP')>-1;});
    EST=buildEST(estOk?estP:invP);
    var built=buildALL(invP);
    ALL_INV=built.allInv; ALL_DATES=built.dates;
    if(ALL_DATES.length&&(!SEL_DATE||ALL_DATES.indexOf(SEL_DATE)===-1))SEL_DATE=ALL_DATES[0];
    applyDate(SEL_DATE);
    setSync(true,'En vivo · '+new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}));
    document.getElementById('loading').style.display='none';
    buildDatePills();render();
  }).catch(function(err){
    console.error(err);setSync(false,'Error de conexión');
  });
}

/* ══ SVG — GRAIN POLY (5 formas) ════════════════════
   est=1  → ▲ pico arriba  (cono)
   est=0  → ➖ plano
   est=-1 → ▼ cráter abajo (cono invertido)
   est=2  → ╱ rampa 45° (de izq-abajo a der-arriba)
   est=-2 → ∧∧ doble pico (dos montañas)
══════════════════════════════════════════════════════ */
function grainPoly(rx,rr,cx,bT,bB,flatY,est){
  if(!est&&est!==0)est=1;
  var bH=bB-bT, pk=Math.round(bH*0.13);
  var peakY=Math.max(bT+4,flatY-pk);
  var dipY =Math.min(bB-4,flatY+pk);
  var mid  =Math.round((rx+rr)/2);

  if(est===1)
    /* ▲ pico central arriba */
    return rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+cx+','+peakY+' '+rx+','+flatY;

  if(est===-1)
    /* ▼ cráter central abajo */
    return rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+cx+','+dipY+' '+rx+','+flatY;

  if(est===0)
    /* ➖ superficie plana */
    return rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+rx+','+flatY;

  if(est===2){
    /* ╱ rampa 45°: izquierda baja, derecha alta */
    var leftY =Math.min(bB-2, flatY+pk);
    var rightY=Math.max(bT+4, flatY-pk);
    return rx+','+bB+' '+rr+','+bB+' '+rr+','+rightY+' '+rx+','+leftY;
  }

  if(est===-2){
    /* ∧∧ doble pico: dos montañas simétricas */
    var q1=Math.round(rx+(rr-rx)*0.25);  /* 1er cuarto */
    var q3=Math.round(rx+(rr-rx)*0.75);  /* 3er cuarto */
    var valY=Math.min(bB-2,flatY+Math.round(pk*0.5)); /* valle entre picos */
    return rx+','+bB+' '+rr+','+bB
      +' '+rr+','+flatY
      +' '+q3+','+peakY
      +' '+mid+','+valY
      +' '+q1+','+peakY
      +' '+rx+','+flatY;
  }

  return rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+rx+','+flatY;
}

/* ══ SVG HELPERS ═════════════════════════════════════ */
function mkDefs(id){
  return '<defs>'
  +'<linearGradient id="m'+id+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2a4258"/><stop offset="10%" stop-color="#506e88"/><stop offset="28%" stop-color="#7a9cb8"/><stop offset="45%" stop-color="#a8c8dc"/><stop offset="55%" stop-color="#b8d4e4"/><stop offset="72%" stop-color="#7a9cb8"/><stop offset="90%" stop-color="#4a6880"/><stop offset="100%" stop-color="#2a4258"/></linearGradient>'
  +'<linearGradient id="cr'+id+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3248"/><stop offset="20%" stop-color="#3a5870"/><stop offset="50%" stop-color="#5a7e9a"/><stop offset="80%" stop-color="#3a5870"/><stop offset="100%" stop-color="#1e3248"/></linearGradient>'
  +'<linearGradient id="g'+id+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#7a4e10" stop-opacity="0.85"/><stop offset="50%" stop-color="#c8921c" stop-opacity="0.80"/><stop offset="100%" stop-color="#e0b030" stop-opacity="0.75"/></linearGradient>'
  +'<linearGradient id="hg'+id+'" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5a3808" stop-opacity="0.82"/><stop offset="50%" stop-color="#a87020" stop-opacity="0.88"/><stop offset="100%" stop-color="#5a3808" stop-opacity="0.82"/></linearGradient>'
  +'<linearGradient id="bw'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9ab8ca"/><stop offset="100%" stop-color="#6888a0"/></linearGradient>'
  +'</defs>';
}
function corrug(rx,rr,bT,bB,flatY,H){var s='',st=Math.max(3,Math.round((bB-bT)/24));for(var y=bT+st;y<bB;y+=st)s+='<line x1="'+rx+'" y1="'+y+'" x2="'+rr+'" y2="'+y+'" stroke="'+(y<flatY?'#284860':'#806018')+'" stroke-width="0.65" opacity="'+(y<flatY?'0.45':'0.5')+'"/>';return s;}
function vertSeams(rx,bw,bT,bB,n){var s='';for(var i=1;i<n;i++){var x=rx+bw*i/n;s+='<line x1="'+x+'" y1="'+bT+'" x2="'+x+'" y2="'+bB+'" stroke="#1e3a50" stroke-width="0.4" opacity="0.3"/>';}return s;}
function diagStair(rx,rr,bT,bB,W){var bw=rr-rx,x1=rr-W*0.05,y1=bB-4,x2=rx+bw*0.30,y2=bT+6,off=W*0.045,steps=Math.round((bB-bT)/Math.max(8,W*0.09));var s='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#d8a010" stroke-width="'+Math.max(2,W*0.030)+'" stroke-linecap="round" opacity="0.95"/><line x1="'+(x1-off)+'" y1="'+y1+'" x2="'+(x2-off)+'" y2="'+y2+'" stroke="#d8a010" stroke-width="'+Math.max(1.5,W*0.022)+'" stroke-linecap="round" opacity="0.95"/>';for(var i=0;i<=steps;i++){var t=i/steps,sx=x1+(x2-x1)*t,sy=y1+(y2-y1)*t;s+='<line x1="'+sx+'" y1="'+sy+'" x2="'+(sx-off)+'" y2="'+sy+'" stroke="#d8a010" stroke-width="'+Math.max(1,W*0.016)+'"/>';}return s;}
function platform(rx,rr,y){return '<rect x="'+(rx-2)+'" y="'+(y-3)+'" width="'+(rr-rx+4)+'" height="4" fill="#d8a010" opacity="0.88"/>';}
function pctBadge(cx,y,pct,fsz,col){var bw=fsz*3,bh=fsz+5;return '<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="'+(bh/2)+'" fill="rgba(8,16,28,0.72)"/><text x="'+cx+'" y="'+(y+bh-3)+'" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-size="'+fsz+'" font-weight="700" fill="'+col+'">'+pct+'%</text>';}
function stateBadge(cx,y,r,s){return '<circle cx="'+cx+'" cy="'+y+'" r="'+r+'" fill="'+s.c+'" opacity="0.9"/><text x="'+cx+'" y="'+(y+r*0.42)+'" text-anchor="middle" font-family="sans-serif" font-size="'+(r*1.3)+'" fill="#fff" font-weight="700">'+s.i+'</text>';}

/* ══ SILO EN BASE ════════════════════════════════════ */

  s+=pctBadge(cx,bT+6,pct,fsz,pc(pct))+stateBadge(cx,bB+Math.round(H*0.055),Math.round(W*0.09),sc);

/* ══ TOLVA ════════════════════════════════════════════ */

function mkSVG(nom,tipo,cap,kg,W,H){
  var id='x'+nom.replace(/[^a-z0-9]/gi,'');
  var pct=cap>0?Math.min(100,Math.max(0,Math.round(kg/cap*100))):0;
  var est=GS[nom]!==undefined?GS[nom]:1;
  if(tipo==='PULMON')return pulmonSVG(id,pct,est,W,H);
  if(tipo==='BODEGA')return bodegaSVG(id,pct,est,W,H);
  if(tipo==='TOLVA') return tolvaSVG(id,pct,est,W,H);
  return siloSVG(id,pct,est,W,H);
}

function sz(cap,maxCap,tipo){
  var r=Math.pow(Math.max(0.08,cap/maxCap),0.43);
  if(tipo==='BODEGA')return{w:Math.round(90+(180-90)*r),h:Math.round(100+(180-100)*r)};
  if(tipo==='TOLVA') return{w:Math.round(45+(80-45)*r),h:Math.round(100+(160-100)*r)};
  return{w:Math.round(72+(160-72)*r),h:Math.round(130+(250-130)*r)};
}

/* ══ RENDER ══════════════════════════════════════════ */
function render(){
  var grupos={};
  EST.forEach(function(d){if(!grupos[d.u])grupos[d.u]=[];grupos[d.u].push(d);});
  Object.keys(grupos).forEach(function(u){grupos[u].sort(function(a,b){return b.c-a.c;});});

  var gC=0,gK=0;
  EST.forEach(function(d){gC+=d.c;gK+=(INV[d.cod]||{kg:0}).kg;});
  var gP=gC>0?Math.round(gK/gC*100):0,gPc=pc(gP);

  document.getElementById('hkpis').innerHTML=hk(ft(gC),'Capacidad')+hk(ft(gK),'Stock')+hk(gP+'%','Ocupación');
  document.getElementById('kbar').innerHTML=
    mkK('nv','Capacidad Sistema',ft(gC),fn(gC/1000)+' TON',100,'#0c2840')+
    mkK('gd','Stock en Almacén',ft(gK),fn(gK)+' KG',gP,gPc)+
    mkK('gn','Espacio Disponible',ft(gC-gK),'Disponible para almacenar',100-gP,'#167848')+
    mkK('st','Ubicaciones',Object.keys(grupos).length+' Plantas',EST.length+' estructuras',100,'#2a6888');

  var uL=Object.keys(grupos).sort();
  document.getElementById('tnav').innerHTML=uL.map(function(u,i){
    return '<div class="tbtn'+(i===TAB?' active':'')+'" data-i="'+i+'">'+u+'<span class="tcnt">'+grupos[u].length+'</span></div>';
  }).join('');

  var main=document.getElementById('main');
  main.innerHTML='';
  uL.forEach(function(ubi,ui){
    var silos=grupos[ubi],maxC=silos[0].c,lC=0,lK=0;
    silos.forEach(function(d){lC+=d.c;lK+=(INV[d.cod]||{kg:0}).kg;});
    var lP=lC>0?Math.round(lK/lC*100):0,lPc=pc(lP);
    var lAct=silos.filter(function(d){return(INV[d.cod]||{kg:0}).kg>0;}).length;

    var panel=document.createElement('div');
    panel.className='panel'+(ui===TAB?' active':'');
    panel.innerHTML=
      '<div class="lsum">'
      +'<div class="lstat"><div class="lsl">Capacidad</div><div class="lsv">'+ft(lC)+'</div></div>'
      +'<div class="lstat"><div class="lsl">Stock actual</div><div class="lsv" style="color:'+lPc+'">'+ft(lK)+'</div></div>'
      +'<div class="lstat"><div class="lsl">% Ocupación</div><div class="lsv" style="color:'+lPc+'">'+lP+'%</div></div>'
      +'<div class="lstat"><div class="lsl">Con stock</div><div class="lsv">'+lAct+' / '+silos.length+'</div></div>'
      +'</div>'
      +'<div class="legend"><strong>Clic para cambiar estado del grano:</strong>'
      +'<span class="li"><span class="ld" style="background:#167848"></span>▲ Llenando</span>'
      +'<span class="li"><span class="ld" style="background:#2a6888"></span>➖ Estable</span>'
      +'<span class="li"><span class="ld" style="background:#982828"></span>▼ Vaciando</span>'
      +'<span class="li"><span class="ld" style="background:#c07818"></span>╱ Inclinado</span>'
      +'<span class="li"><span class="ld" style="background:#8b44ac"></span>∧∧ Doble pico</span>'
      +'</div>'
      +'<div class="sgrid" id="sg'+ui+'"></div>';
    main.appendChild(panel);

    var grid=panel.querySelector('#sg'+ui);
    silos.forEach(function(d){
      var inv=INV[d.cod]||{kg:0,m:''};
      var dim=sz(d.c,maxC,d.t);
      var pct=d.c>0?Math.min(100,Math.max(0,Math.round(inv.kg/d.c*100))):0;
      var estVal=GS[d.n]!==undefined?GS[d.n]:1;
      var sc=SC[String(estVal)];

      var card=document.createElement('div');
      card.className='sc '+sc.cl;
      card.dataset.nom=d.n;
      card.style.width=(dim.w+14)+'px';
      card.innerHTML=
        (inv.kg===0?'<span class="ebadge">VACÍO</span>':'')+
        mkSVG(d.n,d.t,d.c,inv.kg,dim.w,dim.h)+
        '<div class="snom">'+d.n+'</div>'+
        '<div class="stipo">'+(d.t==='PULMON'?'PULMÓN':d.t)+'</div>'+
        '<div class="sfecha">📅 '+fmtDate(SEL_DATE)+'</div>'+
        '<div class="smat" style="max-width:'+(dim.w+8)+'px" title="'+(inv.m||'')+'">'+
          (inv.m?'🌾 '+inv.m:'—')+
        '</div>'+
        '<div class="sstock" style="background:'+pb(pct)+';color:'+pt(pct)+';">'+ft(inv.kg)+'</div>'+
        '<div class="scap">Cap: '+ft(d.c)+'</div>'+
        '<div class="spbar"><div class="spfill" style="width:'+pct+'%;background:'+pc(pct)+'"></div></div>'+
        '<div class="sest" style="color:'+sc.c+';">'+sc.i+' '+sc.l+'</div>';

      card.addEventListener('click',function(e){
        e.stopPropagation();
        var nom=this.dataset.nom;
        var cur=GS[nom]!==undefined?GS[nom]:1;
        /* ciclo: 1 → 0 → -1 → 2 → -2 → 1 */
        var idx=STATE_ORDER.indexOf(cur);
        var next=STATE_ORDER[(idx+1)%STATE_ORDER.length];
        GS[nom]=next;
        saveEstado(nom, next);   /* ← guarda en Firebase */
        render();
      });
      grid.appendChild(card);
    });
  });

  document.querySelectorAll('.tbtn').forEach(function(b){
    b.addEventListener('click',function(){TAB=parseInt(this.dataset.i);render();});
  });
}

function hk(v,l){return '<div class="hkpi"><div class="hkpi-v">'+v+'</div><div class="hkpi-l">'+l+'</div></div>';}
function mkK(cl,lbl,val,sub,p,pcol){
  return '<div class="kpi-card '+cl+'"><div class="klbl">'+lbl+'</div><div class="kval">'+val+'</div><div class="ksub">'+sub+'</div><div class="kmbar"><div class="kmfill" style="width:'+Math.min(100,p)+'%;background:'+pcol+'"></div></div></div>';
}

setInterval(function(){
  var n=new Date();
  document.getElementById('clk').innerHTML=
    n.toLocaleDateString('es-EC',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+'<br>'+
    n.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);

initFirebase();      /* conectar Firebase y escuchar estados */
setInterval(load,300000);
load();
</script>
