<title>ALMACENERA — Control de Silos</title>

<style>
:root{
  --bg:#f2f5f8;--surface:#fff;--surface2:#edf1f5;
  --border:#d8e2ec;--border2:#b8cad8;
  --navy:#0c2840;--navy2:#1a3f5c;--navy3:#2a5878;
  --gold:#c07818;--gold2:#e09820;
  --steel:#2a6888;--steel2:#4a88a8;
  --green:#167848;--amber:#b06010;--red:#982828;
  --text1:#0a1e30;--text2:#3a5870;--text3:#7a98b0;
  --r:10px;--sh:0 2px 10px rgba(12,40,64,.08);--sh2:0 6px 24px rgba(12,40,64,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;}

header{
  background:var(--navy);height:58px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 14px rgba(0,0,0,.28);
}
.hbrand{display:flex;align-items:center;gap:11px;}
.hicon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:17px;}
.htitle{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:2px;color:#fff;line-height:1;}
.hsub{font-size:9px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;margin-top:2px;}
.hkpis{display:flex;}
.hkpi{padding:0 18px;border-left:1px solid rgba(255,255,255,.1);text-align:center;}
.hkpi-v{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--gold2);line-height:1;}
.hkpi-l{font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:2px;}
.hright{display:flex;align-items:center;gap:10px;}
.spill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:4px 11px;}
.sdot{width:7px;height:7px;border-radius:50%;background:#2ecc71;box-shadow:0 0 6px #2ecc71;animation:blink 2s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.stxt{font-size:9px;color:rgba(255,255,255,.5);letter-spacing:.5px;}
#clk{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:rgba(255,255,255,.35);letter-spacing:1px;text-align:right;line-height:1.4;}

.kpi-bar{display:flex;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
.kpi-card{flex:1;min-width:130px;border:1px solid var(--border);border-top:3px solid;border-radius:var(--r);padding:13px 16px;background:var(--surface);box-shadow:var(--sh);transition:box-shadow .2s,transform .2s;}
.kpi-card:hover{box-shadow:var(--sh2);transform:translateY(-1px);}
.kpi-card.nv{border-top-color:var(--navy);}
.kpi-card.gd{border-top-color:var(--gold);}
.kpi-card.gn{border-top-color:var(--green);}
.kpi-card.st{border-top-color:var(--steel);}
.klbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:5px;}
.kval{font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:700;line-height:1;color:var(--text1);}
.kpi-card.gd .kval{color:var(--gold);}
.kpi-card.gn .kval{color:var(--green);}
.kpi-card.st .kval{color:var(--steel);}
.ksub{font-size:10px;color:var(--text3);margin-top:3px;}
.kmbar{height:3px;background:var(--border);border-radius:2px;margin-top:7px;overflow:hidden;}
.kmfill{height:3px;border-radius:2px;transition:width 1s ease;}

.tabs-nav{display:flex;background:var(--surface);border-bottom:2px solid var(--border);padding:0 24px;overflow-x:auto;}
.tbtn{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:13px 18px;color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:7px;}
.tbtn:hover{color:var(--text2);}
.tbtn.active{color:var(--navy);border-bottom-color:var(--navy);}
.tcnt{background:var(--surface2);border:1px solid var(--border);border-radius:12px;font-size:9px;padding:1px 7px;color:var(--text3);}
.tbtn.active .tcnt{background:var(--navy);border-color:var(--navy);color:#fff;}

.panel{display:none;padding:18px 24px;}
.panel.active{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}

.lsum{display:flex;gap:9px;margin-bottom:14px;flex-wrap:wrap;}
.lstat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 15px;flex:1;min-width:110px;box-shadow:var(--sh);}
.lsl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);}
.lsv{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--text1);margin-top:2px;}

.legend{display:flex;align-items:center;gap:16px;margin-bottom:12px;font-size:11px;color:var(--text2);flex-wrap:wrap;}
.legend strong{color:var(--text1);font-weight:600;}
.li{display:flex;align-items:center;gap:5px;}
.ld{width:8px;height:8px;border-radius:50%;}

/* WRAPPING GRID */
.sgrid{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}

.sc{display:flex;flex-direction:column;align-items:center;background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:8px 6px 10px;cursor:pointer;box-shadow:var(--sh);transition:border-color .2s,transform .15s,box-shadow .2s;position:relative;}
.sc:hover{transform:translateY(-3px);box-shadow:var(--sh2);}
.sc.fill{border-color:#167848;}
.sc.stable{border-color:#2a6888;}
.sc.empty{border-color:#982828;}
.sc svg{display:block;}
.snom{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--navy);margin-top:5px;text-transform:uppercase;white-space:nowrap;}
.stipo{font-size:7px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);}
.smat{font-size:8px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;max-width:100%;margin-top:1px;}
.sstock{border-radius:6px;padding:2px 8px;margin-top:4px;font-size:9px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:.5px;}
.scap{font-size:7px;color:var(--text3);margin-top:1px;}
.spbar{width:82%;height:3px;background:var(--border);border-radius:2px;margin-top:4px;overflow:hidden;}
.spfill{height:3px;border-radius:2px;transition:width 1s;}
.sest{font-size:8px;font-weight:600;margin-top:3px;}
.ebadge{position:absolute;top:7px;right:7px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:7px;color:var(--text3);letter-spacing:1px;}

#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:16px;}
.spinner{width:42px;height:42px;border:3px solid var(--border2);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ltxt{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>

function pn(s){
  if(typeof s==='number')return s;
  s=String(s||'').trim().replace(/\s/g,'');if(!s||s==='-')return 0;
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1)
    s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.indexOf(',')>-1)s=s.replace(',','.');
  return parseFloat(s)||0;
}

function corrug(rx,rr,bT,bB,flatY,H){
  var s='', st=Math.max(3,Math.round((bB-bT)/24));
  for(var y=bT+st;y<bB;y+=st){
    var abv=y<flatY;
    s+='<line x1="'+rx+'" y1="'+y+'" x2="'+rr+'" y2="'+y+'" stroke="'+(abv?'#284860':'#806018')+'" stroke-width="0.65" opacity="'+(abv?'0.45':'0.5')+'"/>';
  }
  return s;
}

function vertSeams(rx,bw,bT,bB,n){
  var s='';
  for(var i=1;i<n;i++){var x=rx+bw*i/n;s+='<line x1="'+x+'" y1="'+bT+'" x2="'+x+'" y2="'+bB+'" stroke="#1e3a50" stroke-width="0.4" opacity="0.3"/>';}
  return s;
}

function diagStair(rx,rr,bT,bB,W){
  var bw=rr-rx;
  var x1=rr-W*0.05, y1=bB-4;
  var x2=rx+bw*0.30, y2=bT+6;
  var off=W*0.045;
  var steps=Math.round((bB-bT)/(Math.max(8,W*0.09)));
  var s='';
  s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#d8a010" stroke-width="'+Math.max(2,W*0.030)+'" stroke-linecap="round" opacity="0.95"/>';
  s+='<line x1="'+(x1-off)+'" y1="'+y1+'" x2="'+(x2-off)+'" y2="'+y2+'" stroke="#d8a010" stroke-width="'+Math.max(1.5,W*0.022)+'" stroke-linecap="round" opacity="0.95"/>';
  for(var i=0;i<=steps;i++){
    var tt=i/steps;
    var sx=x1+(x2-x1)*tt, sy=y1+(y2-y1)*tt;
    s+='<line x1="'+sx+'" y1="'+sy+'" x2="'+(sx-off)+'" y2="'+sy+'" stroke="#d8a010" stroke-width="'+Math.max(1,W*0.016)+'"/>';
  }
  return s;
}

function platform(rx,rr,y,W){
  return '<rect x="'+(rx-2)+'" y="'+(y-3)+'" width="'+(rr-rx+4)+'" height="4" fill="#d8a010" opacity="0.88"/>'
        +'<line x1="'+(rx-2)+'" y1="'+(y-3)+'" x2="'+(rx-2)+'" y2="'+(y+8)+'" stroke="#d8a010" stroke-width="1.5"/>'
        +'<line x1="'+(rr+2)+'" y1="'+(y-3)+'" x2="'+(rr+2)+'" y2="'+(y+8)+'" stroke="#d8a010" stroke-width="1.5"/>';
}

function pctBadge(cx,y,pct,fsz,col){

}

function stateBadge(cx,y,r,s){

/* ── SILO EN BASE (wide, prominent cone) ── */
function siloSVG(id,pct,est,W,H){
  var cx=W/2;
  /* body: starts at ~28% from top, ends at ~80% */
  var bT=Math.round(H*0.30), bB=Math.round(H*0.82), bH=bB-bT;
  /* cone: from top ~3% down to bT */
  var cT=Math.round(H*0.03);
  var rx=Math.round(W*0.06), rr=W-rx, bw=rr-rx;
  var fillH=Math.round(bH*pct/100), flatY=bB-fillH;
  var pk=Math.round(bH*0.12);
  var peakY=Math.max(bT+4,flatY-pk);
  var dipY=Math.min(bB-4,flatY+pk);
  var sc=SC[String(est)];
  var fsz=Math.max(7,Math.round(W*0.12));

  var gp=null;
  if(pct>0){
    if(est===1)  gp=rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+cx+','+peakY+' '+rx+','+flatY;
    else if(est===-1)gp=rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+cx+','+dipY+' '+rx+','+flatY;
    else gp=rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+rx+','+flatY;
  }

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+mkDefs(id);
  s+='<clipPath id="cb'+id+'"><rect x="'+rx+'" y="'+bT+'" width="'+bw+'" height="'+bH+'"/></clipPath>';

  /* concrete ring foundation */
  s+='<ellipse cx="'+cx+'" cy="'+bB+'" rx="'+(bw/2+4)+'" ry="'+Math.round(H*0.016)+'" fill="#3a5060" opacity="0.55"/>';
  s+='<rect x="'+(rx-3)+'" y="'+(bB-3)+'" width="'+(bw+6)+'" height="7" rx="3" fill="#3a5870"/>';

  /* body */
  s+='<rect x="'+rx+'" y="'+bT+'" width="'+bw+'" height="'+bH+'" fill="url(#m'+id+')"/>';
  if(gp) s+='<polygon points="'+gp+'" fill="url(#g'+id+')" clip-path="url(#cb'+id+')"/>';
  s+=corrug(rx,rr,bT,bB,flatY,H);
  s+=vertSeams(rx,bw,bT,bB,8);
  s+='<rect x="'+rx+'" y="'+bT+'" width="'+bw+'" height="'+bH+'" fill="none" stroke="#2a4a60" stroke-width="0.7"/>';

  /* yellow staircase (diagonal) */
  s+=diagStair(rx,rr,bT,bB,W);

  /* platform ring at body top */
  s+=platform(rx,rr,bT,W);

  /* safety ladder (left vertical) */
  var lx1=rx-9, lx2=rx-4;
  s+='<line x1="'+lx1+'" y1="'+bT+'" x2="'+lx1+'" y2="'+bB+'" stroke="#d8a010" stroke-width="1.3"/>';
  s+='<line x1="'+lx2+'" y1="'+bT+'" x2="'+lx2+'" y2="'+bB+'" stroke="#d8a010" stroke-width="1.3"/>';
  var lrst=Math.round((bB-bT)/8);
  for(var y=bT+lrst;y<bB;y+=lrst)
    s+='<line x1="'+lx1+'" y1="'+y+'" x2="'+lx2+'" y2="'+y+'" stroke="#d8a010" stroke-width="1"/>';

  /* access door */
  var dW=Math.round(bw*0.14),dH=Math.round(bH*0.09);
  s+='<rect x="'+(cx-dW/2)+'" y="'+(bB-dH-4)+'" width="'+dW+'" height="'+dH+'" rx="1" fill="#1a3040" stroke="#3a6070" stroke-width="0.5"/>';

  /* CONE ROOF — tall, prominent */
  s+='<polygon points="'+cx+','+cT+' '+rx+','+bT+' '+rr+','+bT+'" fill="url(#cr'+id+')" stroke="#1e3248" stroke-width="0.8"/>';
  /* cone panel lines */
  var nPanels=10;
  for(var p=0;p<=nPanels;p++){
    var ex=rx+bw*p/nPanels;
    var ey=bT;
    s+='<line x1="'+cx+'" y1="'+cT+'" x2="'+ex+'" y2="'+ey+'" stroke="#1a3048" stroke-width="0.5" opacity="0.4"/>';
  }
  /* horizontal rings on cone */
  var nCrings=4;
  for(var cr=1;cr<=nCrings;cr++){
    var t=cr/(nCrings+1);
    var cy2=cT+(bT-cT)*t;
    var crx=cx-(bw/2)*t, crr=cx+(bw/2)*t;
    s+='<line x1="'+crx+'" y1="'+cy2+'" x2="'+crr+'" y2="'+cy2+'" stroke="#2a4a60" stroke-width="0.6" opacity="0.5"/>';
  }
  /* vent cap at peak */
  s+='<rect x="'+(cx-4)+'" y="0" width="8" height="'+cT+'" rx="2" fill="#2a4258"/>';
  s+='<ellipse cx="'+cx+'" cy="'+cT+'" rx="8" ry="4" fill="#1e3248" stroke="#3a6070" stroke-width="0.5"/>';

  /* % and state badges */
  s+=pctBadge(cx,bT+6,pct,fsz,pc(pct));
  s+=stateBadge(cx,bB+Math.round(H*0.055),Math.round(W*0.09),sc);
  s+='</svg>';
  return s;
}

/* ── PULMON (fondo cónico, same wide style) ── */
function pulmonSVG(id,pct,est,W,H){
  var cx=W/2;
  var bT=Math.round(H*0.28), bB=Math.round(H*0.60), bH=bB-bT;
  var cT=Math.round(H*0.03);
  var hT=bB, hB=Math.round(H*0.76);
  var hLx=Math.round(W*0.30), hRx=W-hLx;
  var legB=Math.round(H*0.96);

  var fillH=Math.round(bH*pct/100), flatY=bB-fillH;
  var pk=Math.round(bH*0.12);
  var peakY=Math.max(bT+4,flatY-pk), dipY=Math.min(bB-4,flatY+pk);

  var fsz=Math.max(6,Math.round(W*0.11));

  if(pct>0){
    if(est===1) gp=rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+cx+','+peakY+' '+rx+','+flatY;
    else if(est===-1)gp=rx+','+bB+' '+rr+','+bB+' '+rr+','+flatY+' '+cx+','+dipY+' '+rx+','+flatY;

  }

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+mkDefs(id);
  s+='<clipPath id="cb'+id+'"><rect x="'+rx+'" y="'+bT+'" width="'+bw+'" height="'+bH+'"/></clipPath>';

  /* X-brace legs */
  s+='<line x1="'+hLx+'" y1="'+hB+'" x2="'+(hLx-5)+'" y2="'+legB+'" stroke="#3a6858" stroke-width="2.5"/>';
  s+='<line x1="'+hRx+'" y1="'+hB+'" x2="'+(hRx+5)+'" y2="'+legB+'" stroke="#3a6858" stroke-width="2.5"/>';
  s+='<line x1="'+(hLx-5)+'" y1="'+Math.round(H*0.88)+'" x2="'+(hRx+5)+'" y2="'+Math.round(H*0.88)+'" stroke="#3a6858" stroke-width="1.8"/>';
  s+='<line x1="'+hLx+'" y1="'+hB+'" x2="'+(hRx+5)+'" y2="'+legB+'" stroke="#2a5048" stroke-width="1" opacity="0.6"/>';
  s+='<line x1="'+hRx+'" y1="'+hB+'" x2="'+(hLx-5)+'" y2="'+legB+'" stroke="#2a5048" stroke-width="1" opacity="0.6"/>';

  /* hopper */
  s+='<polygon points="'+rx+','+hT+' '+rr+','+hT+' '+hRx+','+hB+' '+hLx+','+hB+'" fill="url(#m'+id+')" stroke="#2a4a60" stroke-width="0.7"/>';
  if(pct>0){
    s+='<polygon points="'+rx+','+hT+' '+rr+','+hT+' '+hRx+','+(hB-2)+' '+hLx+','+(hB-2)+'" fill="url(#hg'+id+')" opacity="0.9" clip-path="url(#ch'+id+')"/>';
  }
  s+='<line x1="'+Math.round(W*0.26)+'" y1="'+Math.round(hT+(hB-hT)*0.38)+'" x2="'+hLx+'" y2="'+(hB-3)+'" stroke="#3a3010" stroke-width="0.6" opacity="0.4"/>';
  s+='<line x1="'+Math.round(W*0.74)+'" y1="'+Math.round(hT+(hB-hT)*0.38)+'" x2="'+hRx+'" y2="'+(hB-3)+'" stroke="#3a3010" stroke-width="0.6" opacity="0.4"/>';
  s+='<rect x="'+(hLx+2)+'" y="'+hB+'" width="'+(hRx-hLx-4)+'" height="'+Math.round(H*0.024)+'" rx="2" fill="#2a4a60"/>';

  /* body */
  s+='<rect x="'+rx+'" y="'+bT+'" width="'+bw+'" height="'+bH+'" fill="url(#m'+id+')"/>';
  if(gp) s+='<polygon points="'+gp+'" fill="url(#g'+id+')" clip-path="url(#cb'+id+')"/>';
  s+=corrug(rx,rr,bT,bB,flatY,H);
  s+=vertSeams(rx,bw,bT,bB,8);
  s+='<rect x="'+rx+'" y="'+bT+'" width="'+bw+'" height="'+bH+'" fill="none" stroke="#2a4a60" stroke-width="0.7"/>';

  s+='<line x1="'+lx1+'" y1="'+bT+'" x2="'+lx1+'" y2="'+bB+'" stroke="#d8a010" stroke-width="1.3"/>';
  s+='<line x1="'+lx2+'" y1="'+bT+'" x2="'+lx2+'" y2="'+bB+'" stroke="#d8a010" stroke-width="1.3"/>';
  var lst2=Math.round((bB-bT)/8);
  for(var yy=bT+lst2;yy<bB;yy+=lst2)
    s+='<line x1="'+lx1+'" y1="'+yy+'" x2="'+lx2+'" y2="'+yy+'" stroke="#d8a010" stroke-width="1"/>';

  var np=10;
  for(var pp=0;pp<=np;pp++){s+='<line x1="'+cx+'" y1="'+cT+'" x2="'+(rx+bw*pp/np)+'" y2="'+bT+'" stroke="#1a3048" stroke-width="0.5" opacity="0.4"/>';}

  s+='<ellipse cx="'+cx+'" cy="'+cT+'" rx="8" ry="4" fill="#1e3248"/>';

  s+=pctBadge(cx,bT+6,pct,fsz,pc(pct));
  s+=stateBadge(cx,hB+Math.round(H*0.06),Math.round(W*0.09),sc);

  return s;

/* ── BODEGA (nave industrial, techo muy alto) ── */
function bodegaSVG(id,pct,est,W,H){
  var cx=W/2;
  var wL=Math.round(W*0.04), wR=W-wL, ww=wR-wL;
  var wT=Math.round(H*0.42), wB=Math.round(H*0.86), wH=wB-wT;
  /* very tall roof - ridge at ~8% from top */
  var ridgeY=Math.round(H*0.06);
  var fillH=Math.round(wH*pct/100), flatY=wB-fillH;
  var sc=SC[String(est)];
  var fsz=Math.max(7,Math.round(W*0.09));

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+mkDefs(id);
  s+='<clipPath id="cb'+id+'"><rect x="'+wL+'" y="'+wT+'" width="'+ww+'" height="'+wH+'"/></clipPath>';

  /* ground slab */
  s+='<rect x="'+(wL-4)+'" y="'+wB+'" width="'+(ww+8)+'" height="'+Math.round(H*0.04)+'" rx="2" fill="#8aa0b0"/>';

  /* walls */
  s+='<rect x="'+wL+'" y="'+wT+'" width="'+ww+'" height="'+wH+'" fill="url(#bw'+id+')" stroke="#4a7080" stroke-width="0.6"/>';

  /* grain fill */
  if(pct>0)
    s+='<rect x="'+(wL+1)+'" y="'+flatY+'" width="'+(ww-2)+'" height="'+fillH+'" fill="url(#g'+id+')" clip-path="url(#cb'+id+')" opacity="0.82"/>';

  /* horizontal cladding */
  var cst=Math.max(5,Math.round(wH/12));
  for(var y=wT+cst;y<wB;y+=cst)
    s+='<line x1="'+wL+'" y1="'+y+'" x2="'+wR+'" y2="'+y+'" stroke="'+(y<flatY?'#406080':'#7898b0')+'" stroke-width="0.55" opacity="0.45"/>';

  /* steel columns */
  [wL,Math.round(wL+ww*.2),Math.round(wL+ww*.4),Math.round(wL+ww*.6),Math.round(wL+ww*.8),wR].forEach(function(cx2){
    s+='<rect x="'+(cx2-1.5)+'" y="'+wT+'" width="3" height="'+wH+'" fill="#3a6070" opacity="0.45"/>';
  });
  s+='<rect x="'+wL+'" y="'+wT+'" width="'+ww+'" height="'+wH+'" fill="none" stroke="#3a6080" stroke-width="0.8"/>';

  /* TALL GABLED ROOF */
  s+='<polygon points="'+(wL-2)+','+wT+' '+cx+','+ridgeY+' '+cx+','+wT+'" fill="url(#cr'+id+')" stroke="#1e3248" stroke-width="0.8"/>';
  s+='<polygon points="'+cx+','+wT+' '+cx+','+ridgeY+' '+(wR+2)+','+wT+'" fill="url(#cr'+id+')" stroke="#1e3248" stroke-width="0.8"/>';

  /* roof purlins */
  for(var rp=1;rp<=5;rp++){
    var rt=rp/6, ry=ridgeY+(wT-ridgeY)*rt;
    var rw2=(ww/2)*rt;
    s+='<line x1="'+(cx-rw2)+'" y1="'+ry+'" x2="'+cx+'" y2="'+ry+'" stroke="#2a4a60" stroke-width="0.65" opacity="0.55"/>';
    s+='<line x1="'+cx+'" y1="'+ry+'" x2="'+(cx+rw2)+'" y2="'+ry+'" stroke="#2a4a60" stroke-width="0.65" opacity="0.55"/>';
  }

  /* roof truss verticals */
  [Math.round(cx-ww*.18),Math.round(cx+ww*.18)].forEach(function(tx){
    s+='<line x1="'+tx+'" y1="'+wT+'" x2="'+cx+'" y2="'+ridgeY+'" stroke="#1e3a50" stroke-width="0.6" opacity="0.45"/>';
  });

  /* ridge line */
  s+='<rect x="'+(cx-2)+'" y="'+ridgeY+'" width="4" height="'+Math.round((wT-ridgeY)*0.5)+'" fill="#2a4258"/>';
  /* ventilation ridge */
  for(var vr=0;vr<4;vr++){
    var vx=cx-Math.round(ww*0.12)*(vr-1.5);
    s+='<rect x="'+(vx-3)+'" y="'+(ridgeY-4)+'" width="7" height="6" rx="1" fill="#2a4060"/>';
  }

  /* large roller doors */
  var dW=Math.round(ww*0.2), dH=Math.round(wH*0.45);
  var dX1=Math.round(wL+ww*0.1);
  s+='<rect x="'+dX1+'" y="'+(wB-dH)+'" width="'+dW+'" height="'+dH+'" rx="1" fill="#1a2e3e" stroke="#2a5060" stroke-width="0.6"/>';
  for(var dp=1;dp<4;dp++) s+='<line x1="'+dX1+'" y1="'+(wB-dH+Math.round(dH*dp/4))+'" x2="'+(dX1+dW)+'" y2="'+(wB-dH+Math.round(dH*dp/4))+'" stroke="#243a4a" stroke-width="0.5"/>';
  var dX2=Math.round(wL+ww*0.65);
  s+='<rect x="'+dX2+'" y="'+(wB-dH)+'" width="'+dW+'" height="'+dH+'" rx="1" fill="#1a2e3e" stroke="#2a5060" stroke-width="0.6"/>';
  for(var dp2=1;dp2<4;dp2++) s+='<line x1="'+dX2+'" y1="'+(wB-dH+Math.round(dH*dp2/4))+'" x2="'+(dX2+dW)+'" y2="'+(wB-dH+Math.round(dH*dp2/4))+'" stroke="#243a4a" stroke-width="0.5"/>';

  /* window strip */
  var wst=Math.round(wH*0.1);
  s+='<rect x="'+(wL+2)+'" y="'+(wT+Math.round(wH*0.08))+'" width="'+(ww-4)+'" height="'+wst+'" fill="#a0c8d8" opacity="0.38" stroke="#5a8898" stroke-width="0.4"/>';
  for(var ws=1;ws<6;ws++) s+='<line x1="'+(wL+ww*ws/6)+'" y1="'+(wT+Math.round(wH*0.08))+'" x2="'+(wL+ww*ws/6)+'" y2="'+(wT+Math.round(wH*0.08)+wst)+'" stroke="#4a7888" stroke-width="0.4" opacity="0.5"/>';

  s+=pctBadge(cx,wT+8,pct,fsz,pc(pct));
  s+='<text x="'+cx+'" y="'+(wB+Math.round(H*0.08))+'" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-size="'+(fsz+1)+'" fill="'+sc.c+'" font-weight="700">'+sc.i+' '+sc.l+'</text>';
  s+='</svg>';
  return s;
}

/* ── TOLVA ── */
function tolvaSVG(id,pct,est,W,H){
  var cx=W/2, sc=SC[String(est)];
  var rx=Math.round(W*.07), rr=W-rx;
  var tT=Math.round(H*.08), tB=Math.round(H*.76), tH=tB-tT;
  var ox=Math.round(W*.36), orr=W-ox;
  var fillH=Math.round(tH*pct/100);
  var fsz=Math.max(6,Math.round(W*.11));

  var s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'">'+mkDefs(id);
  s+='<clipPath id="cb'+id+'"><polygon points="'+rx+','+tT+' '+rr+','+tT+' '+orr+','+tB+' '+ox+','+tB+'"/></clipPath>';
  s+='<line x1="'+ox+'" y1="'+tB+'" x2="'+(ox-3)+'" y2="'+Math.round(H*.93)+'" stroke="#3a6058" stroke-width="2"/>';
  s+='<line x1="'+orr+'" y1="'+tB+'" x2="'+(orr+3)+'" y2="'+Math.round(H*.93)+'" stroke="#3a6058" stroke-width="2"/>';
  s+='<line x1="'+(ox-3)+'" y1="'+Math.round(H*.85)+'" x2="'+(orr+3)+'" y2="'+Math.round(H*.85)+'" stroke="#3a6058" stroke-width="1.5"/>';
  s+='<polygon points="'+rx+','+tT+' '+rr+','+tT+' '+orr+','+tB+' '+ox+','+tB+'" fill="url(#m'+id+')" stroke="#2a4a60" stroke-width="0.7"/>';
  if(pct>0) s+='<polygon points="'+rx+','+tT+' '+rr+','+tT+' '+orr+','+tB+' '+ox+','+tB+'" fill="url(#g'+id+')" clip-path="url(#cb'+id+')" opacity="0.88"/>';
  s+='<rect x="'+(ox+2)+'" y="'+tB+'" width="'+(orr-ox-4)+'" height="'+Math.round(H*.05)+'" rx="2" fill="#2a4a60"/>';
  s+=pctBadge(cx,tT+5,pct,fsz,pc(pct));
  s+='<text x="'+cx+'" y="'+(tB+Math.round(H*.12))+'" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-size="'+fsz+'" fill="'+sc.c+'" font-weight="700">'+sc.i+'</text>';
  s+='</svg>';
  return s;
}

function mkSVG(nom,tipo,cap,kg,W,H){
  var id='x'+nom.replace(/[^a-z0-9]/gi,'');
  var pct=cap>0?Math.min(100,Math.max(0,Math.round(kg/cap*100))):0;
  var est=GS[nom]!==undefined?GS[nom]:1;
  if(tipo==='PULMON') return pulmonSVG(id,pct,est,W,H);
  if(tipo==='BODEGA') return bodegaSVG(id,pct,est,W,H);
  if(tipo==='TOLVA')  return tolvaSVG(id,pct,est,W,H);
  return siloSVG(id,pct,est,W,H);
}

/* ── SIZING (wide, bodega-like proportions) ── */
function sz(cap,maxCap,tipo){
  var r=Math.pow(Math.max(0.08,cap/maxCap),0.43);
  if(tipo==='BODEGA'){
    return{w:Math.round(90+(180-90)*r), h:Math.round(100+(180-100)*r)};
  }
  if(tipo==='TOLVA'){
    return{w:Math.round(45+(80-45)*r), h:Math.round(100+(160-100)*r)};
  }
  /* SILO & PULMON: wide cards */
  return{w:Math.round(72+(160-72)*r), h:Math.round(130+(250-130)*r)};
}

/* ── RENDER ── */
function render(){
  var grupos={};
  EST.forEach(function(d){if(!grupos[d.u])grupos[d.u]=[];grupos[d.u].push(d);});
  Object.keys(grupos).forEach(function(u){grupos[u].sort(function(a,b){return b.c-a.c;});});

  var gC=0,gK=0;
  EST.forEach(function(d){gC+=d.c;gK+=(INV[d.cod]||{kg:0}).kg;});
  var gP=gC>0?Math.round(gK/gC*100):0;
  var gPc=pc(gP);

  document.getElementById('hkpis').innerHTML=
    hk(ft(gC),'Capacidad')+hk(ft(gK),'Stock')+hk(gP+'%','Ocupación');

  document.getElementById('kbar').innerHTML=
    mkK('nv','Capacidad Sistema',ft(gC),fn(gC/1000)+' TON',100,'#0c2840')+
    mkK('gd','Stock en Almacén',ft(gK),fn(gK)+' KG',gP,gPc)+
    mkK('gn','Espacio Disponible',ft(gC-gK),'Disponible para almacenar',100-gP,'#167848')+
    mkK('st','Ubicaciones',Object.keys(grupos).length+' Plantas',EST.length+' estructuras',100,'#2a6888');

  var uL=Object.keys(grupos).sort();
  document.getElementById('tnav').innerHTML=uL.map(function(u,i){
    return '<div class="tbtn'+(i===TAB?' active':'')+'" data-i="'+i+'">'+u+'<span class="tcnt">'+grupos[u].length+'</span></div>';
  }).join('');

  var main=document.getElementById('main');
  main.innerHTML='';
  uL.forEach(function(ubi,ui){
    var silos=grupos[ubi];
    var maxC=silos[0].c, lC=0, lK=0;
    silos.forEach(function(d){lC+=d.c;lK+=(INV[d.cod]||{kg:0}).kg;});
    var lP=lC>0?Math.round(lK/lC*100):0;
    var lPc=pc(lP), lAct=silos.filter(function(d){return(INV[d.cod]||{kg:0}).kg>0;}).length;

    var panel=document.createElement('div');
    panel.className='panel'+(ui===TAB?' active':'');

    panel.innerHTML=
      '<div class="lsum">'
      +'<div class="lstat"><div class="lsl">Capacidad</div><div class="lsv">'+ft(lC)+'</div></div>'
      +'<div class="lstat"><div class="lsl">Stock actual</div><div class="lsv" style="color:'+lPc+'">'+ft(lK)+'</div></div>'
      +'<div class="lstat"><div class="lsl">% Ocupación</div><div class="lsv" style="color:'+lPc+'">'+lP+'%</div></div>'
      +'<div class="lstat"><div class="lsl">Con stock</div><div class="lsv">'+lAct+' / '+silos.length+'</div></div>'
      +'</div>'
      +'<div class="legend"><strong>Clic en el silo para cambiar estado:</strong>'
      +'<span class="li"><span class="ld" style="background:#167848"></span>▲ Llenando</span>'
      +'<span class="li"><span class="ld" style="background:#2a6888"></span>➖ Estable</span>'
      +'<span class="li"><span class="ld" style="background:#982828"></span>▼ Vaciando</span>'
      +'</div>'
      +'<div class="sgrid" id="sg'+ui+'"></div>';

    main.appendChild(panel);

    var grid=panel.querySelector('#sg'+ui);
    silos.forEach(function(d){
      var inv=INV[d.cod]||{kg:0,m:''};
      var dim=sz(d.c,maxC,d.t);
      var pct=d.c>0?Math.min(100,Math.max(0,Math.round(inv.kg/d.c*100))):0;
      var est=GS[d.n]!==undefined?GS[d.n]:1;
      var sc=SC[String(est)];

      var card=document.createElement('div');
      card.className='sc '+sc.cl;
      card.dataset.nom=d.n;
      card.style.width=(dim.w+14)+'px';
      card.innerHTML=
        (inv.kg===0?'<span class="ebadge">VACÍO</span>':'')+
        mkSVG(d.n,d.t,d.c,inv.kg,dim.w,dim.h)+
        '<div class="snom">'+d.n+'</div>'+
        '<div class="stipo">'+(d.t==='PULMON'?'PULMÓN':d.t)+'</div>'+
        '<div class="smat" style="max-width:'+(dim.w+8)+'px">'+(inv.m||'—')+'</div>'+
        '<div class="sstock" style="background:'+pb(pct)+';color:'+pt(pct)+';">'+ft(inv.kg)+'</div>'+
        '<div class="scap">Cap: '+ft(d.c)+'</div>'+
        '<div class="spbar"><div class="spfill" style="width:'+pct+'%;background:'+pc(pct)+'"></div></div>'+
        '<div class="sest" style="color:'+sc.c+';">'+sc.i+' '+sc.l+'</div>';

      card.addEventListener('click',function(e){
        e.stopPropagation();
        var nom=this.dataset.nom;
        var cur=GS[nom]!==undefined?GS[nom]:1;
        GS[nom]=cur===1?0:cur===0?-1:1;
        render();
      });
      grid.appendChild(card);
    });
  });

  document.querySelectorAll('.tbtn').forEach(function(b){
    b.addEventListener('click',function(){TAB=parseInt(this.dataset.i);render();});
  });
}

function hk(v,l){return '<div class="hkpi"><div class="hkpi-v">'+v+'</div><div class="hkpi-l">'+l+'</div></div>';}
function mkK(cl,lbl,val,sub,p,pcol){
  return '<div class="kpi-card '+cl+'">'
    +'<div class="klbl">'+lbl+'</div><div class="kval">'+val+'</div>'
    +'<div class="ksub">'+sub+'</div>'
    +'<div class="kmbar"><div class="kmfill" style="width:'+Math.min(100,p)+'%;background:'+pcol+'"></div></div>'
    +'</div>';
}

/* ── CSV ── */
function parseCSV(txt){
  var rows=[],cur=[],cell='',inQ=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){cur.push(cell.trim());cell='';}
    else if((c==='\n'||c==='\r')&&!inQ){
      if(cell||cur.length){cur.push(cell.trim());rows.push(cur);}
      cell='';cur=[];if(c==='\r'&&txt[i+1]==='\n')i++;
    }else cell+=c;
  }
  if(cell||cur.length){cur.push(cell.trim());rows.push(cur);}
  if(!rows.length)return[];
  var hdr=rows[0].map(function(h){return h.replace(/"/g,'').trim();});
  return rows.slice(1).filter(function(r){return r.some(function(c){return c;});}).map(function(r){
    var o={};hdr.forEach(function(h,j){o[h]=(r[j]||'').replace(/"/g,'').trim();});o._r=r;return o;
  });
}
function buildINV(rows){
  var inv={};
  rows.forEach(function(r){
    var cod=parseInt(r['Almacén']||(r._r&&r._r[4])||'0');
    var mat=(r['Texto breve de material']||(r._r&&r._r[2])||'').trim();
    var kg=pn(r['Libre utilización']||(r._r&&r._r[6])||'0');
    if(!cod)return;
    if(!inv[cod])inv[cod]={kg:0,m:'',_mx:0};
    inv[cod].kg+=kg;
    if(mat&&kg>inv[cod]._mx){inv[cod].m=mat;inv[cod]._mx=kg;}
  });
  return inv;
}
function setSync(ok,txt){
  document.getElementById('sdot').style.cssText='background:'+(ok?'#2ecc71':'#e74c3c')+';box-shadow:0 0 6px '+(ok?'#2ecc71':'#e74c3c');
  document.getElementById('stxt').textContent=txt;
}
function load(){
  fetch(CSV+'&t='+Date.now())
    .then(function(r){return r.text();})
    .then(function(txt){
      INV=buildINV(parseCSV(txt));
      setSync(true,'En vivo · '+new Date().toLocaleTimeString('es-EC'));
      document.getElementById('loading').style.display='none';
      render();
    })
    .catch(function(){
      INV=FB;setSync(false,'Datos locales 25/05/2026');
      document.getElementById('loading').style.display='none';
      render();
    });
}
function pn(s){
  if(typeof s==='number')return s;
  s=String(s||'').trim().replace(/\s/g,'');if(!s||s==='-')return 0;
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1)
    s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(s.indexOf(',')>-1)s=s.replace(',','.');
  return parseFloat(s)||0;
}
function ft(kg){var t=kg/1000;if(t>=1000)return(t/1000).toFixed(1)+'k TON';if(t>=100)return Math.round(t)+' TON';return t.toFixed(2)+' TON';}
function fn(n){return n.toLocaleString('es-EC',{maximumFractionDigits:0});}

setInterval(function(){
  var n=new Date();
  document.getElementById('clk').innerHTML=
    n.toLocaleDateString('es-EC',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+'<br>'+
    n.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
},1000);

setInterval(load,300000);
load();
</script>
